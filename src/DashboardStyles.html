<style>
    html, body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 12px;
            overflow-x: hidden;
            height: 100%;
            
        }
img {
  max-width: 100%;
  max-height: 100%; /* Or set a fixed max-height like 500px */
  width: auto;
  height: auto;
  object-fit: contain;
}
 /* 1. SCROLL CONTAINER - Explicit height limit is mandatory */
    .sticky-table-wrapper {
      width: 100%;
      max-height: 450px; /* Forces vertical scrollbar */
      overflow: auto;    /* Single scroll viewport */
      position: relative;
      border: 1px solid #cbd5e1;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    /* 2. TABLE ROOT - Must use separate borders for sticky to work */
    .sticky-table {
      border-collapse: separate; 
      border-spacing: 0;
      width: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
    }

    .sticky-table th,
    .sticky-table td {
      padding: 10px 14px;
      border-right: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
      box-sizing: border-box;
    }

    /* 3. ALTERNATING ROW & COLUMN MATRIX */
    .sticky-table tbody td[data-row-parity="even"][data-col-parity="even"] { background-color: #ffffff; }
    .sticky-table tbody td[data-row-parity="even"][data-col-parity="odd"]  { background-color: #f8fafc; }
    .sticky-table tbody td[data-row-parity="odd"][data-col-parity="even"]  { background-color: #f1f5f9; }
    .sticky-table tbody td[data-row-parity="odd"][data-col-parity="odd"]   { background-color: #e2e8f0; }

    /* 4. LINK STYLING */
    .sticky-table a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }
    .sticky-table a:hover {
      text-decoration: underline;
    }

    /* 5. STICKY FREEZE PLANES */
    .sticky-cell {
      position: sticky;
      z-index: 1;
    }

    /* Frozen Top Headers */
    .sticky-row {
      z-index: 10 !important; /* Keep above scrolling data cells */
      font-weight: 600;
    }
    .sticky-table thead th[data-col-parity="even"].sticky-row { background-color: #e2e8f0; }
    .sticky-table thead th[data-col-parity="odd"].sticky-row  { background-color: #cbd5e1; }

    /* Frozen Left Columns */
    .sticky-col {
      z-index: 5;
    }
    .sticky-table tbody td[data-row-parity="even"][data-col-parity="even"].sticky-col { background-color: #f1f5f9; }
    .sticky-table tbody td[data-row-parity="even"][data-col-parity="odd"].sticky-col  { background-color: #e2e8f0; }
    .sticky-table tbody td[data-row-parity="odd"][data-col-parity="even"].sticky-col  { background-color: #e2e8f0; }
    .sticky-table tbody td[data-row-parity="odd"][data-col-parity="odd"].sticky-col   { background-color: #cbd5e1; }

    /* Top-Left Frozen Intersection Corners */
    .sticky-corner {
      z-index: 20 !important; /* Topmost priority */
      background-color: #475569 !important;
      color: #ffffff !important;
    }
    .sticky-corner a {
      color: #38bdf8 !important;
    }
    
/* 2. Full-viewport flex container */
.app-layout {
  display: flex;
  flex-direction: column;
  height: 100vh; /* Fallback for older browsers */
  height: 100dvh; /* Adapts correctly on mobile viewport resize */
}

/* 3. Header takes natural height */
.header {
  flex-shrink: 0;
  padding: 1rem;
}

/* 4. Carousel container takes ALL remaining height */
.carousel-container {
  flex: 1; /* Automatically expands to fill remaining space */
  position: relative;
  width: 100%;
  /* overflow: hidden; /* Clips horizontal swipe panels */
}

/* 5. Panels fill container and handle vertical scrolling independently */
.panel {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  min-height: 800px;
  overflow-y: auto; /* Vertical scroll bar appears ONLY inside the panel */
  overflow-x: hidden; 
  /* Keeps layout width identical across all panels */
  scrollbar-gutter: stable;
  -webkit-overflow-scrolling: touch;
  
  transition: transform 0.4s ease-in-out, opacity 0.4s ease-in-out;
  pointer-events: none;
  opacity: 0;
  box-sizing: border-box;
  padding: 16px;
}

.panel * {
  max-width: 100%;
  box-sizing: border-box;
}

.panel.active {
  transform: translateX(0);
  opacity: 1;
  pointer-events: auto;
}

.panel.left {
  transform: translateX(-100%);
  opacity: 0;
}

.panel.right {
  transform: translateX(100%);
  opacity: 0;
}

/* Container centered on the page */
.button-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr); /* Exactly 2 equal columns */
  gap: 12px;
  width: 100%;
  max-width: 800px; /* Limits maximum width on larger screens */
  margin: 0 auto;   /* Centers container horizontally */
  padding: 16px;
  box-sizing: border-box;
}

/* Responsive, centered button styling */
.button-grid button {
  width: 100%;
  padding: 12px 16px;
  font-size: clamp(1.4rem, 1.5vw, 1.1rem); /* Fluid responsive font */
  border: 1px solid #007bff;
  background-color: #007bff;
  color: #ffffff;
  border-radius: 6px;
  cursor: pointer;
  text-align: center;
  transition: background-color 0.2s ease-in-out;
}

.button-grid button:hover {
  background-color: #0056b3;
}

/* Adjust layout on small mobile screens */
@media (max-width: 360px) {
  .button-grid {
    gap: 8px;
    padding: 8px;
  }
}

/* Target the native dialog element */
    dialog {
      border: none;
      border-radius: 8px;
      padding: 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      max-width: 90vw;
      max-height: 90vh;
      overflow: hidden;
    }

    /* Style the dark background backdrop */
    dialog::backdrop {
      background-color: rgba(0, 0, 0, 0.75);
    }

    /* Wrapper for image and close button positioning */
    .dialog-content {
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Close button styling */
    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      font-size: 20px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .close-btn:hover {
      background: rgba(0, 0, 0, 0.9);
    }

    .dialog-content img {
      max-width: 100%;
      max-height: 80vh;
      display: block;
      object-fit: contain;
    }
    .btn-link {
  /* Reset default button appearance */
  background: none;
  border: none;
  padding: 0;
  margin: 0;
  font: inherit;
  
  /* Link typography & colors */
  color: #0066cc;
  text-decoration: underline;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  
  /* Smooth transitions for interactive states */
  transition: color 0.15s ease-in-out, text-decoration-color 0.15s ease-in-out;
}

/* Hover state */
.btn-link:hover {
  color: #004499;
  text-decoration: underline;
}

/* Active / Pressed state */
.btn-link:active {
  color: #002266;
}

/* Keyboard focus state (Accessibility) */
.btn-link:focus-visible {
  outline: 2px solid #0066cc;
  outline-offset: 2px;
  border-radius: 2px;
}

/* Disabled state */
.btn-link:disabled,
.btn-link[aria-disabled="true"] {
  color: #888888;
  text-decoration: none;
  cursor: not-allowed;
  opacity: 0.7;
}

/* SVG Overlay for drawing trend lines accurately over bars */

/* Scrollbar Styling */
