<script>
var filters = {}
const dateFilters = <?!= JSON.stringify(dateFilters) ?>;

window.addEventListener(
    'DOMContentLoaded', 
    function() {
      
      updateAppliedFilters()
      <? if(!permissions.includes("edit") && ! permissions.includes("view") && !permissions.includes("simple")) { ?>
      show("report") 
      handleFilter()
      <? } ?>
      
});


<?!= verifyFilter ?>

function resetFilter() {
    filters = {}
    sortList = []
    groupByList = new Set()
    summaryList = new Set()
    groupSortList = []
    
    updateAppliedFilters()
    updateSort()
    updateGroupBy()
    updateSummary()
    updateGroupSort()
    
    changeAppliedFiltersVisibility()
    handleFilter()
}

function downloadData() {
   
    savePageAsPDF()
}

function changeAppliedFiltersVisibility() {
    <? if(permissions.includes("admin")) { ?>
    visible("backupRestoreButtons", Object.keys(filters).length && !groupByList.size)
    hide("backupBtn") 
    <? } ?>
    visible("plotChart", groupByList.size && summaryList.has("Sum of expenses"));
    visible("searchBtn", Object.keys(filters).length)
    visible("downloadBtn", Object.keys(filters).length)
    visible("resetFilterBtn", Object.keys(filters).length || sortList.length || groupByList.size || summaryList.size || groupSortList.length)
    visible("saveFilterBtn", Object.keys(filters).length)
    visible("sorts", groupByList.size==0)
    visible("sortButtons", groupByList.size==0)
    visible("groupTab", sortList.length==0)
    visible("groupButtons", sortList.length==0)
    visible("summaryTab", sortList.length==0 && groupByList.size != 0)
    visible("summaryButtons", sortList.length==0 && groupByList.size != 0)
    visible("groupSorts", sortList.length == 0 && groupByList.size!=0)
    visible("groupSortButtons", sortList.length == 0 && groupByList.size!=0)
}

function updateAppliedFilters() {
    var keys = Object.keys(availableFilters);
    
    hide("errorFilter") 
   
    const hasError = renderFilterError(
        verifyFilter(filters)
    );
        
        
    keys.forEach((filter, i) => {
        var sectionId = `filter_${i}`
        var labelId = `filterLabel_${i}`;
        var valueId = `filterValue_${i}`
        if(filters[filter]) {
            clearChildren(valueId);
            
            for(rowIndex in filters[filter]) {
                const div = document.createElement("div")
                div.textContent = filters[filter][rowIndex].map((column) => (column.label + " " + column.text)). join(" ");
                getElement(valueId).appendChild(div)
                
            }
            
        } else {
           
            hide(sectionId)
        }
        
        visible(sectionId, filters[filter])
    })
    visible("noFilter",  isEmpty(filters))
    
    changeAppliedFiltersVisibility()
    
    return hasError
}

function renderFilterError(err) {
    if(err) {
        getElement("errorFilter").textContent = err;
        show("errorFilter")
        loaded(true)
        return true
    }
    
    return false
}

function saveCurrentFilter() {
    show("saveFilter")
}



function removeFilter(f) {
   
    const newFilters ={}
    for(filter in filters) {
        
        if(filter != f) {
            newFilters[filter] = filters[filter]
        }
    }
    filters = newFilters
    updateAppliedFilters()
    handleFilter()
}

function handleFilter() {
    const groupBys = Array.from(groupByList);
    const summarys = Array.from(summaryList);
    
    currentPageIndex++;
    loaded(false);
    
    google.script.run
        .withSuccessHandler(renderPage(currentPageIndex))
        .withFailureHandler(renderDataFailure)
        .getDataOfFilter(filters, groupBys.length == 0 ? sortList : groupSortList, groupBys, summarys, false);    
}
</script>
