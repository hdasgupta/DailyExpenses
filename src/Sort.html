<div id="addSort" class="modal-overlay"> 
<div class="modal-box">
     <table id="filterTypeTab">
        <tbody>
            <tr>
                <td colspan="2" style="text-align: center">
                    <h3>Add Sort</h3>
                </td>
            </tr>
            <tr>
                
                <td width="20%">
                    Sort by
                </td>
                <td>
                    <div class="custom-select" id="sortBy">
                        <div class="select-box">Select unit</div>
                        <div class="options-container">
                        <? for(columnIndex in columns) { ?>
                        <div class="option" data-value="<?= columnIndex ?>">
                            <?= columns[columnIndex] ?>
                        </div>
                        <? } ?>
                        </div>
                    </div>
                    
            
                </td>
            </tr>
            <tr>
                
                <td width="20%">
                    Order
                </td>
                <td>
                    <div id="order" class="custom-select">
                        <div class="select-box">Select order</div>
                        <div class="options-container">
                        <div class="option" data-value="asc">Ascending</div>
                        <div class="option" data-value="desc">Descending</div>
                        </div>
                    </div>
                    
                </td>
            </tr>
        
            <tr>
                <td style="text-align: center" colspan="2">
                    <input type="button" onclick="hide('addSort')" value="Close" class="btn ">
                    <input type="button" onclick="handleAddingSort()" value="Add" class="btn ">
                </td>
            </tr>
        </tbody>
    </table>
</div>
</div>
<script>


function removeSort(sortBy) {
    const newSorts = []
    for(index in sortList) {
        if(Object.keys(sortList[index])[0]!=sortBy) {
            newSorts.push(sortList[index]) 
        }
    }
    sortList = newSorts
    updateSort()
}

function updateSort() {
    clearChildren("sortList")
    clearChildren("actionList")
    if(sortList.length==0) {
        getElement("sortList").textContent = "No sort"
    }
    for(index in sortList) {
        for(sortBy in sortList[index]) {
            
            const div = document.createElement("div")
            const span = document. createElement("div")
            const remove = document. createElement("input")
            span.style.padding= '10px'
            span.textContent = sortBy + " ("+sortList[index][sortBy]+")"
            
            remove.id= "remove_"+sortBy
            remove. value = "Remove"
            remove. type = "button"
            remove. style. textAlign = "right"
            
            remove.addEventListener('click', function() {
                removeSort(sortBy)
                getElement("actionList").removeChild(remove.id)
            })
            
            div. appendChild(remove)
            getElement("sortList").appendChild(span)
            getElement("actionList").appendChild(div)
        }
       
    }
    
    changeAppliedFiltersVisibility()
}


</script>
